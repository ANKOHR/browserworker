[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browserworker"
version = "0.1.0"
description = "Deterministic, screenshot-backed scripted browser automation with human takeover."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["playwright>=1.45,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
browserworker = "browserworker.cli:main"

[tool.setuptools.packages.find]
include = ["browserworker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
